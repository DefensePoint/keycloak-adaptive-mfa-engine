name: Release

# Pushing a tag like v1.0.1 runs the unit tests, builds the engine image
# from that tag, pushes it to GHCR, and publishes a GitHub Release whose
# notes carry the pull command and the image digest. The engine's
# deliverable is the image; the SPI and admin-ui JARs are released from
# their own repositories.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push the image to GHCR

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amfa
          POSTGRES_PASSWORD: amfa
          POSTGRES_DB: amfa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U amfa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: amfa
      POSTGRES_PASSWORD: amfa
      POSTGRES_DB: amfa
      POSTGRES_SCHEMA: public
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Database migrations
        run: python -m alembic upgrade head
      - name: Unit tests
        run: python -m pytest tests/unit -m "not slow"

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          DIGEST="${{ steps.build.outputs.digest }}"
          NOTES="$(printf '%s\n\n%s\n%s\n%s\n\n%s' \
            "Engine image for this release:" \
            '```' \
            "docker pull ${IMAGE}:${GITHUB_REF_NAME#v}" \
            '```' \
            "Digest: \`${DIGEST}\` (pin with \`${IMAGE}@${DIGEST}\` for reproducible deployments).")"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "$NOTES"
